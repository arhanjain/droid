institution: Yonsei
task_id: place_gray_mug_to_yellow_plate
language_instruction: Pick up the gray mug and place it onto the yellow plate.
success_criteria: |
  The gray mug ends up on the yellow plate and the gripper releases it.
max_timesteps: 500
# Milestones are cumulative and must be ordered so that reaching milestone N
# implies all earlier milestones were also reached. The operator picks a single
# "highest milestone reached" after each rollout.
milestones:
  - name: reached_mug
    description: Gripper made contact with the gray mug.
  - name: lifted_up_mug
    description: Gray mug was lifted clearly off the tabletop.
  - name: above_plate
    description: The majority of the gray mug (in the gripper or dropped) is above the plate, but not placed fully on the plate (either it's standing up or not released yet).
  - name: completely_on_plate
    description: Gray mug ends up completely on the yellow plate and the gripper releases it.
